name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cloud-lab

jobs:

  # ── Job 1: Test ─────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint with ruff
        run: ruff check app/main.py --select E,F,W --ignore E501
        continue-on-error: true   # lint warnings don't block — errors do

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ERROR_RATE: "0.0"
          APP_LATENCY_SECONDS: "0.0"
          JAEGER_ENDPOINT: "http://localhost:4317"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: .pytest_cache/

  # ── Job 2: Build & Scan ──────────────────────────────────────────────────────
  build:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: test   # only runs if tests pass

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with git SHA for traceability — every image is unique
            type=sha,prefix=sha-,format=short
            # Tag latest on main branch only
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with branch name on PRs
            type=ref,event=branch

      - name: Build Docker image (no push yet — scan first)
        uses: docker/build-push-action@v5
        id: build-local
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-target
          format: table
          exit-code: 1           # fail pipeline on CRITICAL CVEs
          severity: CRITICAL     # only block on critical — warn on HIGH
          ignore-unfixed: true   # don't fail on vulns with no fix available

      - name: Build and push image (scan passed)
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}  # don't push on PRs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image details
        run: |
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  # ── Job 3: Deploy ────────────────────────────────────────────────────────────
  # Only runs on push to main (not PRs) after build succeeds
  # NOTE: This job requires a self-hosted runner on your WSL2 machine
  # to have kubectl access to your k3s cluster.
  # See README for setup instructions.
  deploy:
    name: Deploy to k3s
    runs-on: self-hosted    # runs on your WSL2 machine
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "SHA_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update deployment image
        run: |
          kubectl set image deployment/cloud-lab \
            cloud-lab=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.SHA_TAG }} \
            -n app

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cloud-lab \
            -n app \
            --timeout=120s

      - name: Verify deployment health
        run: |
          # Wait for pods to pass readiness probe
          kubectl wait --for=condition=ready pod \
            -l app=cloud-lab \
            -n app \
            --timeout=60s

          echo "Deployment successful"
          kubectl get pods -n app

      - name: Notify Slack on success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"✅ Deployment successful\",
              \"attachments\": [{
                \"color\": \"good\",
                \"fields\": [
                  {\"title\": \"Commit\", \"value\": \"${{ github.sha }}\", \"short\": true},
                  {\"title\": \"Author\", \"value\": \"${{ github.actor }}\", \"short\": true},
                  {\"title\": \"Message\", \"value\": \"${{ github.event.head_commit.message }}\"}
                ]
              }]
            }"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"❌ Deployment failed — ${{ github.sha }}\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Author\", \"value\": \"${{ github.actor }}\", \"short\": true},
                  {\"title\": \"Run\", \"value\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}
                ]
              }]
            }"
