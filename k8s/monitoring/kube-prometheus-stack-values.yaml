# ─────────────────────────────────────────────────────────────────────────────
# kube-prometheus-stack values — WSL2 compatible
# Fixes: duplicate default datasource, node-exporter disabled (WSL2 limitation)
# ─────────────────────────────────────────────────────────────────────────────

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "admin"

  service:
    type: NodePort
    nodePort: 32000

  # ── Datasources — only ONE can be isDefault: true ─────────────────────────
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy
      isDefault: false    # Prometheus is default, Loki is secondary

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: cloud-lab
          orgId: 1
          folder: "Cloud Lab"
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/cloud-lab

  dashboardsConfigMaps:
    cloud-lab: "grafana-dashboards"

  grafana.ini:
    server:
      root_url: "http://localhost:32000"

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  enabled: true

  service:
    type: NodePort
    nodePort: 32090

  prometheusSpec:
    scrapeInterval: "15s"
    evaluationInterval: "15s"

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    additionalScrapeConfigs:
      - job_name: "cloud-lab-app"
        scrape_interval: "5s"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - app
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+);(.+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - target_label: service
            replacement: cloud-lab-api

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager:
  enabled: true

  service:
    type: NodePort
    nodePort: 32093

  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-config

# ── kube-state-metrics ────────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true

# ── node-exporter ─────────────────────────────────────────────────────────────
# DISABLED — WSL2 does not support the host path mount node-exporter requires
# Enable this when deploying to a real Linux node or cloud cluster
nodeExporter:
  enabled: false

# ── K8s component scraping ────────────────────────────────────────────────────
kubeApiServer:
  enabled: true

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false


# Disable sidecar datasource discovery — prevents duplicate default datasource conflict
  sidecar:
    datasources:
      enabled: false
