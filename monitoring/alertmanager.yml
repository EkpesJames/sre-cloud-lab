global:
  resolve_timeout: 30s

  smtp_smarthost: "smtp.mail.yahoo.com:587"
  smtp_from: "je_inbox@yahoo.co.uk"
  smtp_auth_username: "je_inbox@yahoo.co.uk"
  smtp_auth_password: "auyuvkzblsjybgdx"
  smtp_require_tls: true

route:
  receiver: "slack-alerts"

  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1m

  routes:
    - match:
        severity: critical
      receiver: "slack-alerts"

    - match:
        severity: warning
      receiver: "email-alert"

receivers:
  - name: "slack-alerts"
    slack_configs:
      - api_url: "SLACK_WEBHOOK_PLACEHOLDER"
        channel: "#general"
        send_resolved: true
        title: "Alert: {{ .CommonLabels.alertname }}"
        text: |
          *Status:* {{ .Status }}
          *Instance:* {{ .CommonLabels.instance }}
          *Summary:* {{ .CommonAnnotations.summary }}

  - name: "email-alert"
    email_configs:
      - to: "je_inbox@yahoo.co.uk"
        send_resolved: true
